# Render.com Infrastructure as Code
# Deploy PumpBNB platform with automated service configuration

services:
  # Backend API Service
  - type: web
    name: pumpbnb-backend
    env: node
    region: oregon # Change to your preferred region
    plan: free # Upgrade to 'starter' for production ($7/mo - always on)
    branch: main
    rootDir: backend
    buildCommand: npm install && npx prisma migrate deploy && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      # Server Configuration
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3001

      - key: HOST
        value: 0.0.0.0

      # Database - Auto-linked from pumpbnb-db
      - key: DATABASE_URL
        fromDatabase:
          name: pumpbnb-db
          property: connectionString

      # Redis - Auto-linked from pumpbnb-redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: pumpbnb-redis
          property: connectionString

      # MongoDB (Optional) - Add if using MongoDB Atlas
      # - key: MONGODB_URI
      #   sync: false

      # Blockchain Configuration
      - key: BSC_TESTNET_RPC
        value: https://bsc-testnet-rpc.publicnode.com

      - key: BSC_MAINNET_RPC
        value: https://bsc-dataseed1.binance.org

      - key: CHAIN_ID
        value: 97

      # Contract Addresses (Updated October 27, 2025)
      - key: TOKEN_FACTORY_ADDRESS
        value: 0xCF0b298E26db22bCc886E03654A2Bfcb4E2742C2

      - key: GRADUATION_MANAGER_ADDRESS
        value: 0xeE147bc2307b645c59033B7A0b16EC5E68b2A5d3

      - key: PLATFORM_CONFIG_ADDRESS
        value: 0x0e4ED6983Bc8100936C42e5D98F9f1fEbF76b58E

      - key: ASTER_TOKEN_ADDRESS
        value: 0x2e5bEffE46eAADAb062ED2b520a0d95654CEdF5A

      - key: SAMPLE_TOKEN_ADDRESS
        value: 0xcFE6968c3427EcA3641d7132E03F53E7096d370e

      # IPFS Configuration (Add your Pinata credentials in Render Dashboard)
      - key: PINATA_API_KEY
        sync: false # Manually set in Render Dashboard

      - key: PINATA_SECRET_KEY
        sync: false # Manually set in Render Dashboard

      - key: PINATA_JWT
        sync: false # Manually set in Render Dashboard

      # Security
      - key: JWT_SECRET
        generateValue: true # Auto-generate secure random value

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: CORS_ORIGIN
        value: https://pumpbnb-frontend.onrender.com

      # Rate Limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000

      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100

      # Logging
      - key: LOG_LEVEL
        value: info

  # Frontend Service (Next.js)
  - type: web
    name: pumpbnb-frontend
    env: node
    region: oregon # Same region as backend for low latency
    plan: free # Upgrade to 'starter' for production ($7/mo)
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start

    envVars:
      # WalletConnect
      - key: NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
        value: 2365a77b538750a5741bacd4891ac5cf

      # Network Configuration
      - key: NEXT_PUBLIC_CHAIN_ID
        value: 97

      - key: NEXT_PUBLIC_NETWORK_NAME
        value: BSC Testnet

      # Contract Addresses
      - key: NEXT_PUBLIC_TOKEN_FACTORY
        value: 0xCF0b298E26db22bCc886E03654A2Bfcb4E2742C2

      - key: NEXT_PUBLIC_PLATFORM_CONFIG
        value: 0x0e4ED6983Bc8100936C42e5D98F9f1fEbF76b58E

      - key: NEXT_PUBLIC_GRADUATION_MANAGER
        value: 0xeE147bc2307b645c59033B7A0b16EC5E68b2A5d3

      - key: NEXT_PUBLIC_MOCK_ASTER
        value: 0x2e5bEffE46eAADAb062ED2b520a0d95654CEdF5A

      - key: NEXT_PUBLIC_SAMPLE_TOKEN
        value: 0xcFE6968c3427EcA3641d7132E03F53E7096d370e

      # Backend API Connection
      - key: NEXT_PUBLIC_API_URL
        value: https://pumpbnb-backend.onrender.com

      - key: NEXT_PUBLIC_WS_URL
        value: wss://pumpbnb-backend.onrender.com

databases:
  # PostgreSQL Database (if not already created)
  - name: pumpbnb-db
    databaseName: pumpbnb_production
    plan: free # Upgrade to 'starter' for production ($7/mo)
    region: oregon
    ipAllowList: [] # Empty = allow all (needed for Render services to connect)

# Note: Redis is created as "Key-Value Store" in Render Dashboard
# Add this manually via Dashboard → New → Key-Value Store
# Name: pumpbnb-redis, Plan: free, Region: oregon, maxmemoryPolicy: allkeys-lru
